plugins { id 'com.android.application' }

def signingFile = rootProject.file('.signing/signing.properties')
def signingValues = new Properties()
if (signingFile.exists()) signingFile.withInputStream { signingValues.load(it) }

android {
    namespace 'com.vyskoyenebo.pet'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'com.vyskoyenebo.pet'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
    flavorDimensions += 'androidVersion'
    productFlavors {
        android8 { dimension 'androidVersion'; minSdk 26 }
        android10 { dimension 'androidVersion'; minSdk 29 }
        android11 { dimension 'androidVersion'; minSdk 30 }
        android12 { dimension 'androidVersion'; minSdk 31 }
    }
    signingConfigs {
        localRelease {
            if (signingFile.exists()) {
                storeFile rootProject.file('.signing/pet-release.jks')
                storePassword signingValues['storePassword']
                keyAlias signingValues['keyAlias']
                keyPassword signingValues['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.localRelease
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    androidResources { noCompress += ['webp'] }
    lint { abortOnError true; checkReleaseBuilds true }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
